name: Build Coloratura-Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten (kein Wrapper im Repo -> Gradle direkt installieren)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Mod bauen
        run: gradle build --stacktrace

      - name: Fertige .jar als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: coloratura-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
